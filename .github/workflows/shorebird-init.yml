name: Shorebird Init (une seule fois)

# Crée l’application « Mon budget (version vierge) » sur ton compte Shorebird
# et commite le fichier shorebird.yaml (app_id) dans le dépôt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop if already initialized
        run: |
          if [ -f shorebird.yaml ]; then
            echo "::error::shorebird.yaml existe déjà : l'app Shorebird est déjà créée."
            exit 1
          fi
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::Ajoute le secret SHOREBIRD_TOKEN au dépôt (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Shorebird app
        run: shorebird init --force --display-name "Mon budget (version vierge)"

      - name: Commit shorebird.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml android/app/src/main/AndroidManifest.xml
          git commit -m "Ajoute la configuration Shorebird (app_id)"
          git push
