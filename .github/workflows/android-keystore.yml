name: Créer la clé Android (une seule fois)

# Génère la clé de signature de l'app et la met dans un artefact téléchargeable
# (fichiers texte prêts à copier dans les secrets du dépôt). L'artefact expire après 1 jour.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          mkdir cle-android && cd cle-android
          PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore mon-budget.jks -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 -alias mon-budget \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Mon Budget, O=Perso, C=FR" >/dev/null 2>&1
          printf '%s' "$(base64 -w0 mon-budget.jks)" > ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > ANDROID_KEYSTORE_PASSWORD.txt
          printf '%s' "$PASS" > ANDROID_KEY_PASSWORD.txt
          printf '%s' "mon-budget" > ANDROID_KEY_ALIAS.txt
          cat > LISEZMOI.txt <<TXT
          Chaque fichier ANDROID_....txt = un secret à créer dans le dépôt :
          Settings > Secrets and variables > Actions > New repository secret
          Nom du secret = nom du fichier (sans .txt), valeur = contenu du fichier.

          Garde une copie de ce dossier (mon-budget.jks + mot de passe) dans un endroit sûr :
          sans cette clé, tu ne pourras plus installer de nouvelle version de l'app par-dessus l'ancienne.
          TXT
          ls

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: cle-android
          path: cle-android/
          retention-days: 1
